name: Build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
# Keep only the newest validation per branch. Frequent Android iterations
# must not leave dozens of stale Chromium downloads and Gradle builds running.
concurrency:
  group: object-fonctionnement-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      # Ubuntu hosted runners already provide Chromium's common runtime
      # libraries. Avoid apt-get update on every push: it can stall for many
      # minutes even though the app and browser tests have not started.
      - run: npx playwright install chromium
      - run: npm run generate:previews
      - run: npm run test:browser
      - run: npm run check
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: npm run android:icons
      - run: |
          sed -i 's/versionCode 1/versionCode 46/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "0.46.0"/' android/app/build.gradle
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: object-fonctionnement-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
